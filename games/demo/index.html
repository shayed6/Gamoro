<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gamoro ডেমো গেম</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0C4A34;
    --green-2: #176746;
    --gold: #E9A820;
    --bg: #F0F8F2;
    --surface: #ffffff;
    --text: #17372B;
    --muted: #63796D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101B17;
      --surface: #182720;
      --text: #F1F7F3;
      --muted: #B3C5B9;
      --green-2: #9BD6B5;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Hind Siliguri", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .hud {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border-bottom: 1px solid rgba(12,74,52,0.1);
    z-index: 10;
  }
  .hud-title {
    font-size: 14px;
    color: var(--muted);
  }
  .hud-score {
    font-size: 18px;
    font-weight: 700;
    color: var(--green);
  }
  @media (prefers-color-scheme: dark) {
    .hud-score { color: var(--green-2); }
  }
  .arena {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .target {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold), #D4890B);
    box-shadow: 0 4px 14px rgba(233,168,32,0.45);
    border: 3px solid #fff;
    cursor: pointer;
    touch-action: manipulation;
    transform: translate(-50%, -50%) scale(1);
    transition: transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
  }
  .target:active {
    transform: translate(-50%, -50%) scale(0.9);
  }
  .tip {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="hud-title">বৃত্তে ট্যাপ করুন</div>
    <div class="hud-score" id="score">স্কোর: ০</div>
  </div>
  <div class="arena" id="arena">
    <div class="target" id="target" aria-label="লক্ষ্য বৃত্ত">⚡</div>
    <div class="tip">লক্ষ্যে ট্যাপ করে পয়েন্ট বাড়ান</div>
  </div>

  <script>
    // Throttle gamoro-activity reporting to max once per second
    let lastReport = 0;
    function reportActivity() {
      const now = Date.now();
      if (now - lastReport >= 1000) {
        lastReport = now;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'gamoro-activity' }, location.origin);
          }
        } catch (e) {}
      }
    }

    ['pointerdown', 'touchstart', 'keydown'].forEach(function(ev) {
      window.addEventListener(ev, reportActivity, { passive: true, capture: true });
    });

    // Simple demo game logic
    var score = 0;
    var target = document.getElementById('target');
    var arena = document.getElementById('arena');
    var scoreElem = document.getElementById('score');

    function bnNum(n) {
      return Number(n).toLocaleString('bn-BD');
    }

    function moveTarget() {
      var w = arena.clientWidth;
      var h = arena.clientHeight;
      var pad = 48;
      var x = pad + Math.random() * Math.max(10, (w - pad * 2));
      var y = pad + Math.random() * Math.max(10, (h - pad * 2));
      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    target.addEventListener('pointerdown', function(e) {
      e.stopPropagation();
      reportActivity();
      score++;
      scoreElem.textContent = 'স্কোর: ' + bnNum(score);
      moveTarget();
    });

    arena.addEventListener('pointerdown', function() {
      reportActivity();
    });

    window.addEventListener('resize', moveTarget);
    setTimeout(moveTarget, 50);
  </script>
</body>
</html>
