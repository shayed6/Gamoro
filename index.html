<style>

.bell{position:relative;margin-left:auto}.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--green);white-space:nowrap}.badge[hidden]{display:none}

.search[hidden],.filters[hidden]{display:none}.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 12px;margin-bottom:12px}.search svg{width:19px;height:19px;color:var(--muted);flex:none}.search input{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--text);padding:12px 0;font-size:14px}.search input:focus-visible{outline:none}.search:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 5px;margin-bottom:12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);padding:6px 12px;font-size:12px}.filter.active{background:var(--green);color:white;border-color:var(--green)}
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.game-card{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:11px 5px 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);text-align:center;transition:transform .16s,border-color .16s}.game-card:hover{transform:translateY(-2px);border-color:var(--gold)}.game-icon{display:grid;place-items:center;width:55px;height:55px;border-radius:17px;font-size:29px;position:relative}.game-card .name{font-size:12px;font-weight:600;line-height:1.3}.game-card .tag{font-size:10px;color:var(--muted);line-height:1}.game-card .play-dot{position:absolute;right:-4px;bottom:-4px;display:grid;place-items:center;width:22px;height:22px;border:2px solid var(--surface);border-radius:50%;background:var(--green);color:white;font-size:10px}.game-card[hidden]{display:none}.empty{display:none;padding:24px 10px;text-align:center;color:var(--muted);font-size:14px}.empty.show{display:block}

.overlay{position:fixed;inset:0;z-index:40;background:#0008;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .26s cubic-bezier(.4,0,.2,1),visibility 0s linear .26s}.overlay.open{opacity:1;visibility:visible;transition:opacity .3s cubic-bezier(.22,1,.36,1),visibility 0s linear 0s}.drawer{position:fixed;inset:0 auto 0 0;z-index:41;width:min(85vw,340px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);visibility:hidden;transform:translate3d(-105%,0,0);transition:transform .26s cubic-bezier(.4,0,.2,1),visibility 0s linear .26s;will-change:transform;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.drawer.open{visibility:visible;transform:translate3d(0,0,0);transition:transform .34s cubic-bezier(.22,1,.36,1),visibility 0s linear 0s}.drawer-head{display:flex;align-items:center;gap:10px;padding:17px 15px;background:var(--green);color:white}.drawer-head .brand{font-size:22px}.drawer-head .brand-mark{width:37px;height:37px}.close-btn{margin-left:auto;width:38px;height:38px;border:0;border-radius:11px;background:#ffffff1c;color:white;font-size:24px;touch-action:manipulation;transition:transform .14s ease,background-color .16s ease}.close-btn:active{transform:scale(.92)}.drawer-body{overflow:auto;overscroll-behavior:contain;padding:10px}.nav-item,.account-toggle{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:0;border-radius:11px;background:transparent;color:var(--text);text-align:left;font-size:14px;touch-action:manipulation;transition:background-color .15s ease,transform .28s cubic-bezier(.22,1,.36,1),opacity .22s ease}.drawer:not(.open) .nav-item,.drawer:not(.open) .account-toggle{opacity:0;transform:translate3d(-12px,0,0)}.drawer.open .nav-item,.drawer.open .account-toggle{opacity:1;transform:translate3d(0,0,0)}.nav-item:hover,.account-toggle:hover{background:var(--surface2)}.nav-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--surface2);flex:none}.chevron{margin-left:auto;transition:transform .2s}.account-toggle[aria-expanded=true] .chevron{transform:rotate(180deg)}.submenu{display:none;margin:0 0 5px 43px;padding-left:9px;border-left:2px solid var(--line)}.submenu.open{display:block}.submenu button{display:block;width:100%;padding:9px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-size:13px}.submenu button:hover{background:var(--surface2)}.drawer-bottom{margin-top:auto;border-top:1px solid var(--line);padding:13px 15px}.theme-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.theme-switch{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);color:var(--text);font-size:12px}.toast{position:fixed;z-index:60;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100vw - 28px);transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--green);color:white;padding:11px 15px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<div class="app">
<div class="topwrap">
<header class="header">
 <button class="icon-button" id="openMenu" aria-label="মেনু খুলুন" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
 <div class="brand"><img class="brand-mark" src="logo.png" alt="Gamoro" width="34" height="34"><span>Gamoro</span></div>
 <button class="icon-button bell" id="bellBtn" aria-label="নোটিফিকেশন" aria-expanded="false" aria-controls="npanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 004 0"/></svg><span class="badge" id="badge" hidden></span></button>
  <div class="points" id="pointsBadge" aria-label="পয়েন্ট" hidden><span class="coin">★</span><span id="points">০</span><span class="plabel">পয়েন্ট</span></div>
  <a href="auth.html" class="points points-login" id="guestLoginBadge" aria-label="লগইন">লগইন</a>
</header>
 <div class="npanel" id="npanel" hidden aria-hidden="true" role="dialog" aria-label="নোটিফিকেশন"><div class="nhead"><strong>নোটিফিকেশন</strong><button class="ntext" id="markRead">সব পড়া হয়েছে</button></div><div class="nitem" id="emailVerifyNotice" style="display:none;cursor:pointer"><span aria-hidden="true">✉️</span><div><p style="font-weight:600">আপনার ইমেইল ভেরিফাই করুন</p><small style="color:var(--green-2)">উইথড্র পেজে যান →</small></div></div><div class="nlist" id="notifList"></div><div class="nempty" id="nempty">কোনো নতুন নোটিফিকেশন নেই।</div></div>
</div>
<main>
 <section class="ad" id="topAdSlot" aria-label="উপরের বিজ্ঞাপন" hidden></section>
 <button id="dailyBtn" class="btn" hidden>🎁 আজকের বোনাস নিন</button>
 <section aria-labelledby="gamesTitle">
  <div class="section-head"><h2 id="gamesTitle">গেম খেলুন</h2><button class="text-button" id="showAll" hidden>সব গেম দেখুন →</button></div>
  <label class="search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="gameSearch" type="search" placeholder="গেম খুঁজুন..." aria-label="গেম খুঁজুন"></label>
  <div class="filters" aria-label="গেম ক্যাটাগরি" hidden>
   <button class="filter active" data-category="সব">সব গেম</button><button class="filter" data-category="পাজল">পাজল</button><button class="filter" data-category="আর্কেড">আর্কেড</button><button class="filter" data-category="অ্যাকশন">অ্যাকশন</button><button class="filter" data-category="ক্যাজুয়াল">ক্যাজুয়াল</button>
  </div>
  <div class="game-grid" id="gameGrid">
   <button class="game-card" data-game="রঙ মিলান" data-category="পাজল"><span class="game-icon" style="background:#FFE4C7">🎨<i class="play-dot">▶</i></span><span class="name">রঙ মিলান</span><span class="tag">পাজল</span></button>
   <button class="game-card" data-game="দ্রুত ট্যাপ" data-category="আর্কেড"><span class="game-icon" style="background:#D9F1E3">⚡<i class="play-dot">▶</i></span><span class="name">দ্রুত ট্যাপ</span><span class="tag">আর্কেড</span></button>
   <button class="game-card" data-game="মেমোরি কার্ড" data-category="পাজল"><span class="game-icon" style="background:#E7E0FF">🧠<i class="play-dot">▶</i></span><span class="name">মেমোরি কার্ড</span><span class="tag">পাজল</span></button>
   <button class="game-card" data-game="পাজল টাইম" data-category="পাজল"><span class="game-icon" style="background:#FFE0E0">🧩<i class="play-dot">▶</i></span><span class="name">পাজল টাইম</span><span class="tag">পাজল</span></button>
   <button class="game-card" data-game="স্পেস রান" data-category="অ্যাকশন"><span class="game-icon" style="background:#DDEBFF">🚀<i class="play-dot">▶</i></span><span class="name">স্পেস রান</span><span class="tag">অ্যাকশন</span></button>
   <button class="game-card" data-game="ফল কাটুন" data-category="ক্যাজুয়াল"><span class="game-icon" style="background:#FFF0B8">🍉<i class="play-dot">▶</i></span><span class="name">ফল কাটুন</span><span class="tag">ক্যাজুয়াল</span></button>
   <button class="game-card" data-game="বল বাউন্স" data-category="আর্কেড"><span class="game-icon" style="background:#D8F3F5">🏀<i class="play-dot">▶</i></span><span class="name">বল বাউন্স</span><span class="tag">আর্কেড</span></button>
   <button class="game-card" data-game="ম্যাচ থ্রি" data-category="পাজল"><span class="game-icon" style="background:#FADFF0">💎<i class="play-dot">▶</i></span><span class="name">ম্যাচ থ্রি</span><span class="tag">পাজল</span></button>
   <button class="game-card" data-game="মিনি ফুটবল" data-category="ক্যাজুয়াল"><span class="game-icon" style="background:#DDF2D5">⚽<i class="play-dot">▶</i></span><span class="name">মিনি ফুটবল</span><span class="tag">ক্যাজুয়াল</span></button>
  </div>
  <div class="empty" id="emptyState">এই নামে কোনো গেম পাওয়া যায়নি।</div>
 </section>
 <section class="quick-stats" aria-label="আপনার অবস্থা">
  <div class="stat"><span class="stat-icon">🔥</span><strong id="streakValue" class="is-guest-hint">লগইন করলে দেখুন</strong><span>খেলার ধারাবাহিকতা</span></div>
  <div class="stat"><span class="stat-icon">🏆</span><strong id="rankValue" class="is-guest-hint">লগইন করলে দেখুন</strong><span>মাসিক র‍্যাঙ্ক</span></div>
 </section>
 <section class="ad ad-large" id="bottomAdSlot" aria-label="নিচের বিজ্ঞাপন" hidden></section>
</main>
<footer><strong>Gamoro</strong> · খেলুন, উপভোগ করুন, এগিয়ে যান।</footer>
</div>
<div class="overlay" id="overlay" aria-hidden="true"></div>
<aside class="drawer" id="drawer" aria-label="প্রধান মেনু" aria-hidden="true">
 <div class="drawer-head"><div class="brand"><img class="brand-mark" src="logo.png" alt="Gamoro" width="37" height="37"><span>Gamoro</span></div><button class="close-btn" id="closeMenu" aria-label="মেনু বন্ধ করুন">×</button></div>
 <nav class="drawer-body">
  <button class="account-toggle" id="accountToggle" aria-expanded="false" aria-controls="accountSubmenu"><span class="nav-icon">👤</span><span id="accountLabel">অ্যাকাউন্ট</span><span class="chevron">⌄</span></button>
  <div class="submenu" id="accountSubmenu">
    <button data-action="লগইন" id="menuLogin">লগইন</button>
    <button data-action="সাইন আপ" id="menuSignup">সাইন আপ</button>
    <button data-action="পাসওয়ার্ড ভুলে গেছেন" id="menuForgot">পাসওয়ার্ড ভুলে গেছেন</button>
    <button data-action="অ্যাকাউন্ট মুছুন" id="menuDeleteAccount" style="color:var(--coral)">অ্যাকাউন্ট মুছুন</button>
    <button data-action="লগআউট" id="menuLogout" style="display:none;color:var(--coral)">লগআউট</button>
  </div>
  <button class="nav-item" data-action="লিডারবোর্ড"><span class="nav-icon">🏆</span>লিডারবোর্ড</button>
  <button class="nav-item" data-action="উইথড্রয়াল"><span class="nav-icon">💸</span>উইথড্রয়াল</button>
  <button class="nav-item" data-action="রেফারেল"><span class="nav-icon">🎁</span>রেফারেল</button>
  <a class="nav-item" id="menuAdmin" style="display:none;text-decoration:none;cursor:pointer;"><span class="nav-icon">⚙️</span>অ্যাডমিন প্যানেল</a>
  <button class="nav-item" data-action="সহায়তা"><span class="nav-icon">❓</span>সহায়তা</button>
  <button class="nav-item" data-action="প্রাইভেসি পলিসি"><span class="nav-icon">🔒</span>প্রাইভেসি পলিসি</button>
 </nav>
 <div class="drawer-bottom"><div class="theme-row"><span>থিম পরিবর্তন</span><button class="theme-switch" id="themeToggle">🌙 ডার্ক মোড</button></div></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { GAMES } from "./games.js";
import { claimDaily } from "./daily-bonus.js";
import { onAuthStateChanged, signOut } from "firebase/auth";
import { doc, getDoc, collection, query, orderBy, limit, getDocs } from "firebase/firestore";

(() => {
 const root=document.documentElement, openBtn=document.getElementById('openMenu'), closeBtn=document.getElementById('closeMenu'), drawer=document.getElementById('drawer'), overlay=document.getElementById('overlay'), accountToggle=document.getElementById('accountToggle'), submenu=document.getElementById('accountSubmenu'), themeToggle=document.getElementById('themeToggle'), toast=document.getElementById('toast');
 let previousFocus=null, toastTimer=null, activeCategory='সব';
 function openDrawer(){previousFocus=document.activeElement;drawer.classList.add('open');overlay.classList.add('open');drawer.setAttribute('aria-hidden','false');overlay.setAttribute('aria-hidden','false');openBtn.setAttribute('aria-expanded','true');closeBtn.focus();document.addEventListener('keydown',keyHandler)}
 function closeDrawer(){drawer.classList.remove('open');overlay.classList.remove('open');drawer.setAttribute('aria-hidden','true');overlay.setAttribute('aria-hidden','true');openBtn.setAttribute('aria-expanded','false');document.removeEventListener('keydown',keyHandler);if(previousFocus)previousFocus.focus()}
 function keyHandler(e){if(e.key==='Escape'){closeDrawer();return}if(e.key!=='Tab'||!drawer.classList.contains('open'))return;const f=[...drawer.querySelectorAll('button:not([disabled]),a[href]')];if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus()}}
 function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
 
 openBtn.addEventListener('click',openDrawer);closeBtn.addEventListener('click',closeDrawer);overlay.addEventListener('click',closeDrawer);
 accountToggle.addEventListener('click',()=>{const on=accountToggle.getAttribute('aria-expanded')==='true';accountToggle.setAttribute('aria-expanded',String(!on));submenu.classList.toggle('open',!on)});
 themeToggle.addEventListener('click',()=>{const dark=root.getAttribute('data-theme')!=='dark';root.setAttribute('data-theme',dark?'dark':'light');themeToggle.textContent=dark?'☀️ লাইট মোড':'🌙 ডার্ক মোড';document.querySelector('meta[name="theme-color"]').content=dark?'#101B17':'#0C4A34'});

 // Handle navigation and drawer actions
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
   const act = b.dataset.action;
   if(act === 'লগইন'){
     window.location.href = 'auth.html#login';
     return;
   }
   if(act === 'সাইন আপ'){
     window.location.href = 'auth.html#signup';
     return;
   }
   if(act === 'পাসওয়ার্ড ভুলে গেছেন'){
     window.location.href = 'auth.html#forgot';
     return;
   }
   if(act === 'অ্যাকাউন্ট মুছুন'){
     window.location.href = 'delete-account.html';
     return;
   }
   if(act === 'লিডারবোর্ড'){
     window.location.href = 'leaderboard.html';
     return;
   }
   if(act === 'রেফারেল'){
     window.location.href = 'referral.html';
     return;
   }
   if(act === 'উইথড্রয়াল' || act === 'টাকা তোলা'){
     window.location.href = 'withdraw.html';
     return;
   }
   if(act === 'সহায়তা'){
     window.location.href = 'help.html';
     return;
   }
   if(act === 'লগআউট'){
     signOut(auth).then(()=>{
       showToast('সফলভাবে লগআউট হয়েছে');
       if(drawer.classList.contains('open'))closeDrawer();
     }).catch(e=>{
       showToast('লগআউট ব্যর্থ হয়েছে');
     });
     return;
   }
   showToast(act + ' — শীঘ্রই আসছে');
   if(drawer.classList.contains('open'))closeDrawer();
 }));

 document.querySelectorAll('[data-game]').forEach(b => {
   b.addEventListener('click', () => {
     const match = GAMES.find(g => g.name === b.dataset.game);
     const gid = match ? match.id : 'color-match';
     window.location.href = `play.html?game=${gid}`;
   });
 });
 const search=document.getElementById('gameSearch'), cards=[...document.querySelectorAll('.game-card')], empty=document.getElementById('emptyState');
 function filterGames(){const q=search.value.trim().toLocaleLowerCase('bn');let shown=0;cards.forEach(card=>{const matchName=card.dataset.game.toLocaleLowerCase('bn').includes(q);const matchCategory=activeCategory==='সব'||card.dataset.category===activeCategory;const visible=matchName&&matchCategory;card.hidden=!visible;if(visible)shown++});empty.classList.toggle('show',shown===0)}
 search.addEventListener('input',filterGames);
 document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===btn));activeCategory=btn.dataset.category;filterGames()}));
 document.getElementById('showAll').addEventListener('click',()=>{search.value='';activeCategory='সব';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.category==='সব'));filterGames();showToast('সব গেম দেখানো হচ্ছে')});

 // বিজ্ঞাপন লোড না হলে ad slot গুলো বক্স ছাড়াই লুকানো থাকবে
 ['topAdSlot', 'bottomAdSlot'].forEach((slotId) => {
   const slot = document.getElementById(slotId);
   if (!slot) return;
   const syncAdVisibility = () => {
     const hasLoadedAd = slot.childElementCount > 0 || slot.textContent.trim().length > 0;
     slot.hidden = !hasLoadedAd;
   };
   syncAdVisibility();
   new MutationObserver(syncAdVisibility).observe(slot, { childList: true, subtree: true, characterData: true });
 });

 function getDhakaPeriodKey() {
   const parts = new Intl.DateTimeFormat('en-US', {
     timeZone: 'Asia/Dhaka',
     year: 'numeric',
     month: '2-digit'
   }).formatToParts(new Date());
   const y = parts.find(p => p.type === 'year')?.value;
   const m = parts.find(p => p.type === 'month')?.value;
   return `${y}-${m}`;
 }

 const bell=document.getElementById('bellBtn'),np=document.getElementById('npanel'),badge=document.getElementById('badge'),nempty=document.getElementById('nempty'),notifList=document.getElementById('notifList');
 const emailNotice = document.getElementById('emailVerifyNotice');
 let currentUid = null;
 let latestNotifMs = 0;
 let needEmailVerifyState = false;
 let notifLoadedForUid = null;
 let notifLoadedAtMs = -1;
 let cachedNotifs = [];

 function toTimestampMs(val) {
   if (!val) return 0;
   if (typeof val.toMillis === 'function') return val.toMillis();
   if (typeof val.seconds === 'number') return val.seconds * 1000;
   const ms = Date.parse(val);
   return Number.isFinite(ms) ? ms : 0;
 }

 function formatNotifTime(val) {
   const ms = toTimestampMs(val);
   if (!ms) return '';
   try {
     const d = new Date(ms);
     return d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' }) + ', ' +
            d.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
   } catch {
     return '';
   }
 }

 function refreshBellUI() {
   let lastSeen = 0;
   try {
     lastSeen = Number(localStorage.getItem('notifLastSeen') || 0);
   } catch {}
   const hasNew = Boolean(currentUid && latestNotifMs > lastSeen);
   if (emailNotice) emailNotice.style.display = needEmailVerifyState ? 'flex' : 'none';
   if (hasNew) {
     badge.textContent = 'নতুন';
     badge.hidden = false;
   } else if (needEmailVerifyState) {
     badge.textContent = '১';
     badge.hidden = false;
   } else {
     badge.hidden = true;
     badge.textContent = '';
   }
   if (nempty) {
     const hasItems = needEmailVerifyState || cachedNotifs.length > 0;
     nempty.hidden = hasItems;
   }
 }

 function renderNotifications(items, seenBeforeMs) {
   if (!notifList) return;
   notifList.innerHTML = '';
   items.forEach((n) => {
     const row = document.createElement('div');
     const createdMs = toTimestampMs(n.createdAt);
     row.className = 'nitem' + (createdMs > seenBeforeMs ? ' nitem-new' : '');

     const icon = document.createElement('span');
     icon.setAttribute('aria-hidden', 'true');
     icon.textContent = String(n.type || '').startsWith('referral') ? '🎁' : '💸';

     const content = document.createElement('div');
     const titleEl = document.createElement('p');
     titleEl.style.fontWeight = '600';
     titleEl.textContent = n.title || 'নোটিফিকেশন';

     const bodyEl = document.createElement('p');
     bodyEl.style.fontSize = '12.5px';
     bodyEl.textContent = n.body || '';

     const timeEl = document.createElement('small');
     timeEl.textContent = formatNotifTime(n.createdAt);

     content.appendChild(titleEl);
     if (n.body) content.appendChild(bodyEl);
     if (timeEl.textContent) content.appendChild(timeEl);

     row.appendChild(icon);
     row.appendChild(content);

     if (n.link === 'withdraw.html' || n.link === 'referral.html' || n.link === 'help.html') {
       row.addEventListener('click', () => { window.location.href = n.link; });
     }
     notifList.appendChild(row);
   });
   if (nempty) {
     nempty.hidden = needEmailVerifyState || items.length > 0;
   }
 }

 async function loadNotificationsOnOpen() {
   let prevSeen = 0;
   try {
     prevSeen = Number(localStorage.getItem('notifLastSeen') || 0);
     localStorage.setItem('notifLastSeen', String(Math.max(Date.now(), latestNotifMs)));
   } catch {}
   refreshBellUI();

   if (!currentUid) return;
   if (notifLoadedForUid === currentUid && notifLoadedAtMs === latestNotifMs) {
     return;
   }

   if (notifList) {
     notifList.innerHTML = '<div class="nempty">লোড হচ্ছে...</div>';
     if (nempty) nempty.hidden = true;
   }
   try {
     const q = query(
       collection(db, 'users', currentUid, 'notifications'),
       orderBy('createdAt', 'desc'),
       limit(20)
     );
     const snap = await getDocs(q);
     const list = [];
     snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
     cachedNotifs = list;
     notifLoadedForUid = currentUid;
     notifLoadedAtMs = latestNotifMs;
     renderNotifications(list, prevSeen);
   } catch {
     cachedNotifs = [];
     if (notifList) notifList.innerHTML = '';
     if (nempty) nempty.hidden = needEmailVerifyState;
   }
 }

 function setPanel(o){
   np.hidden=!o;
   np.setAttribute('aria-hidden',String(!o));
   bell.setAttribute('aria-expanded',String(o));
   if (o) loadNotificationsOnOpen();
 }
 bell.addEventListener('click',e=>{e.stopPropagation();setPanel(np.hidden)});
 document.addEventListener('click',e=>{if(!np.hidden&&!np.contains(e.target))setPanel(false)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!np.hidden){setPanel(false);bell.focus()}});
 if (emailNotice) {
   emailNotice.addEventListener('click', () => { window.location.href = 'withdraw.html'; });
 }
 document.getElementById('markRead').addEventListener('click', () => {
   try {
     localStorage.setItem('notifLastSeen', String(Math.max(Date.now(), latestNotifMs)));
   } catch {}
   needEmailVerifyState = false;
   if (notifList) {
     notifList.querySelectorAll('.nitem-new').forEach((el) => el.classList.remove('nitem-new'));
   }
   refreshBellUI();
 });

 // Firebase Auth state listener
 const menuLogin = document.getElementById('menuLogin');
 const menuSignup = document.getElementById('menuSignup');
 const menuForgot = document.getElementById('menuForgot');
 const menuLogout = document.getElementById('menuLogout');
 const menuAdmin = document.getElementById('menuAdmin');
 const accountLabel = document.getElementById('accountLabel');
 const pointsElem = document.getElementById('points');
 const pointsBadge = document.getElementById('pointsBadge');
 const guestLoginBadge = document.getElementById('guestLoginBadge');
 const dailyBtn = document.getElementById('dailyBtn');
 const streakValue = document.getElementById('streakValue');
 const rankValue = document.getElementById('rankValue');

 function setQuickStatsGuest() {
   if (streakValue) {
     streakValue.textContent = 'লগইন করলে দেখুন';
     streakValue.classList.add('is-guest-hint');
   }
   if (rankValue) {
     rankValue.textContent = 'লগইন করলে দেখুন';
     rankValue.classList.add('is-guest-hint');
   }
 }

 onAuthStateChanged(auth, async (user) => {
   if (user) {
     if (pointsBadge) pointsBadge.hidden = false;
     if (guestLoginBadge) guestLoginBadge.hidden = true;
     menuLogin.style.display = 'none';
     menuSignup.style.display = 'none';
     menuForgot.style.display = 'none';
     menuLogout.style.display = 'block';
     if (dailyBtn) {
       dailyBtn.hidden = false;
       dailyBtn.disabled = false;
       dailyBtn.textContent = '🎁 আজকের বোনাস নিন';
       dailyBtn.onclick = (e) => claimDaily(user, e.currentTarget).then((res) => {
         if (res && res.ok) {
           if (streakValue && typeof res.streak === 'number') {
             streakValue.textContent = `${Number(res.streak).toLocaleString('bn-BD')} দিন`;
             streakValue.classList.remove('is-guest-hint');
           }
           getDoc(doc(db, 'users', user.uid)).then((fresh) => {
             if (fresh.exists()) {
               const fData = fresh.data();
               if (fData.points !== undefined && fData.points !== null) {
                 pointsElem.textContent = Number(fData.points).toLocaleString('bn-BD');
               }
               const freshStreak = typeof fData.streak === 'number' && fData.streak >= 0 ? fData.streak : 0;
               if (streakValue) {
                 streakValue.textContent = `${freshStreak.toLocaleString('bn-BD')} দিন`;
                 streakValue.classList.remove('is-guest-hint');
               }
             }
           }).catch(() => {});
         }
       });
     }

     try {
       const tokenResult = await user.getIdTokenResult();
       if (tokenResult?.claims?.admin === true) {
         menuAdmin.href = 'admin.html';
         menuAdmin.style.display = 'flex';
       } else {
         menuAdmin.style.display = 'none';
         menuAdmin.removeAttribute('href');
       }
     } catch (e) {
       menuAdmin.style.display = 'none';
       menuAdmin.removeAttribute('href');
     }

     let streakNum = 0;
     currentUid = user.uid;
     latestNotifMs = 0;
     try {
       const userDocRef = doc(db, 'users', user.uid);
       const snap = await getDoc(userDocRef);
       if (snap.exists()) {
         const data = snap.data();
         if (data.name) {
           accountLabel.textContent = data.name;
         }
         if (data.points !== undefined && data.points !== null) {
           pointsElem.textContent = Number(data.points).toLocaleString('bn-BD');
         } else {
           pointsElem.textContent = '০';
         }
         streakNum = typeof data.streak === 'number' && data.streak >= 0 ? data.streak : 0;
         latestNotifMs = toTimestampMs(data.lastNotifAt);
       } else {
         if (user.displayName) {
           accountLabel.textContent = user.displayName;
         }
         pointsElem.textContent = '০';
       }
     } catch (e) {
       console.log('Firebase user doc fetch error (rules or config):', e.message);
       pointsElem.textContent = '০';
     }

     if (streakValue) {
       streakValue.textContent = `${streakNum.toLocaleString('bn-BD')} দিন`;
       streakValue.classList.remove('is-guest-hint');
     }

     // মাসিক র‍্যাঙ্ক: leaderboards/{YYYY-MM} থেকে ইউজারের অবস্থান (firestore.rules অনুমোদিত)
     if (rankValue) {
       rankValue.textContent = '—';
       rankValue.classList.remove('is-guest-hint');
       try {
         const lbSnap = await getDoc(doc(db, 'leaderboards', getDhakaPeriodKey()));
         if (lbSnap.exists()) {
           const lbData = lbSnap.data() || {};
           let foundRank = null;
           if (Array.isArray(lbData.top)) {
             const idx = lbData.top.findIndex((item) => item && item.uid === user.uid);
             if (idx !== -1) foundRank = idx + 1;
           }
           if (!foundRank && lbData.ranks && typeof lbData.ranks[user.uid] === 'number') {
             foundRank = lbData.ranks[user.uid];
           }
           rankValue.textContent = foundRank ? `#${Number(foundRank).toLocaleString('bn-BD')}` : '—';
         }
       } catch (e) {
         rankValue.textContent = '—';
       }
     }

     needEmailVerifyState = user.emailVerified === false;
     refreshBellUI();
   } else {
     currentUid = null;
     latestNotifMs = 0;
     needEmailVerifyState = false;
     notifLoadedForUid = null;
     notifLoadedAtMs = -1;
     cachedNotifs = [];
     if (notifList) notifList.innerHTML = '';
     if (pointsBadge) pointsBadge.hidden = true;
     if (guestLoginBadge) guestLoginBadge.hidden = false;
     accountLabel.textContent = 'অ্যাকাউন্ট';
     pointsElem.textContent = '০';
     setQuickStatsGuest();
     menuLogin.style.display = 'block';
     menuSignup.style.display = 'block';
     menuForgot.style.display = 'block';
     menuLogout.style.display = 'none';
     if (menuAdmin) {
       menuAdmin.style.display = 'none';
       menuAdmin.removeAttribute('href');
     }
     refreshBellUI();
     if (dailyBtn) {
       dailyBtn.hidden = true;
       dailyBtn.onclick = null;
     }
   }
 });
})();
</script>
</body>
</html>
